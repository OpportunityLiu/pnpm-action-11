name: CI

on:
  push:
    branches: ["*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        pnpm-version: [10, 11]

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
      - uses: pnpm/action-setup@master
        with:
          version: ${{ matrix.pnpm-version }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm why monaco-editor
